# cargo-deny — RustSec advisories for this crate's dependency tree.
#
# Findings DEP-3 / F-31 of the September 2026 technical review: none of the three Rust
# repositories measured advisories, while the third-party sibling `ai-memory` in the same
# folder already had a `deny.toml`.
#
# F-31 predicted the exact hole this file found: the `time = "=0.3.41"` pin, documented as
# debt because of `wry`'s `cookie`, "is the typical case where an advisory would go
# unnoticed". It had one — RUSTSEC-2026-0009 — and the pin turned out to be movable to
# 0.3.47 with no code change at all.
#
# ## The doctrine here is the same as scripts/prova-auditoria.mjs in SHVIA-WORKSPACE
#
# An entry in `ignore` is a debt with a WRITTEN reason and a way to re-check it. "We'll look
# later" is not a reason. An exception whose reason has gone stale is worse than no
# exception, because it reads as a decision.
#
# Run: cargo deny check advisories

[graph]
all-features = false

[output]
feature-depth = 1

[advisories]
version = 2
# cargo-deny's default scope for `unsound` covers only the workspace's direct dependencies,
# so a transitive one passed in silence while `cargo audit` reported it (measured 23/09/2026:
# glib and event-listener). "all" makes the two tools agree.
unsound = "all"
ignore = [
    # The ten GTK3 entries (RUSTSEC-2024-0411..0420) left in 1.6.4: RustSec WITHDREW those
    # advisories on 2026-08-14, and cargo-deny reported each ignore as advisory-not-detected.
    # An ignore that matches nothing reads as a decision and guards nothing.

    # ── Compile-time only ──────────────────────────────────────────────────
    # `proc-macro-error` runs during compilation and ships no runtime code.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error — unmaintained, compile-time only, pulled by Tauri's macro crates" },

    # The five `unic-*` ignores (RUSTSEC-2025-0075/0080/0081/0098/0100) left on 23/10/2026: Tauri
    # no longer pulls those crates and cargo-deny reported each one as advisory-not-detected.

    # `glib` 0.18 is Tauri's GTK3 tree again (gtk 0.18 → tauri, wry, tao, muda, webkit2gtk,
    # libappindicator). The unsound impl is `VariantStrIter`, which `Variant::array_iter_str`
    # builds. Measured 24/09/2026: neither of them is named by our code or by any of the 392
    # packages of the Linux tree (the same search finds it in three files of glib itself).
    # Our only glib use is `glib::prelude::*` for the Linux WebView signal handlers in lib.rs
    # (configure_linux_webview).
    #
    # The fix is glib >= 0.20, and until 1.6.52 this said it "only arrives with Tauri's move to
    # gtk4". Not anymore: gtk3-rs published gtk 0.19.0 on 2026-09-08, on glib 0.22. What still
    # holds glib at 0.18 is webkit2gtk-rs: 2.0.2, on glib ^0.18, pinned `=2.0.2` by wry (still
    # so in wry 0.57). When a webkit2gtk on gtk 0.19 reaches wry and tauri, this ignore goes,
    # and GitHub's Dependabot alert #1 closes as fixed. The WebView crates move with tauri/wry
    # (.github/dependabot.yml), so the bump arrives as a tauri/wry proposal.
    { id = "RUSTSEC-2024-0429", reason = "glib VariantStrIter unsound — nothing in the tree uses it (measured 24/09/2026); fix is glib>=0.20, held at 0.18 by webkit2gtk-rs 2.0.2" },

    # quick-xml (RUSTSEC-2026-0194/0195) left in 1.6.4 as well: plist 1.10.1 accepts the
    # patched quick-xml 0.42, so `cargo update -p plist` closed it — the "cannot be fixed
    # here" measured earlier had gone stale.

    # ── zip 4.6.1, three extraction advisories (published 09–10/10/2026, fixed in zip >= 9.0.0) ──
    # The only path to `zip` is `tauri-plugin-updater` 2.14.0 (the latest 2.x; 3.0.0 is still an
    # alpha), which pins zip 4 and calls `ZipArchive::extract` in exactly one place:
    # `extract_zip`, the Windows install path, on bytes it has already checked with
    # `verify_signature` against the minisign public key in `tauri.conf.json`. The three flaws
    # need a MALICIOUS archive (SUID/SGID bits, a symlink pointing outside the destination);
    # an archive that passes our signature check is one we built and signed ourselves, and the
    # updater only ever asks the configured ShvIA server. We do not use `zip` anywhere else.
    # Re-check when `tauri-plugin-updater` takes zip >= 9: this block goes with it.
    { id = "RUSTSEC-2026-0367", reason = "zip SUID/SGID preserved on extract — only via tauri-plugin-updater's Windows install path, after the minisign signature check; fix is zip>=9, held at 4 by the plugin" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract writes symlinks outside the destination — same single caller, same signed-archive precondition" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract applies permissions through symlinks — same single caller, same signed-archive precondition" },

    # ── zbus_names / zvariant / zvariant_derive: unmaintained, merged into zbus 6 (16/10/2026) ──
    # No flaw is reported; the advisory is that the standalone crates stopped. They are the D-Bus
    # layer of the Linux notification, single-instance and opener plugins (zbus 5.16 under
    # notify-rust 4.18, tauri-plugin-single-instance 2.5.3 and tauri-plugin-opener 2.7.2), and we
    # also name `zbus = "5"` ourselves. Moving to zbus 6 needs those plugins to move first, or the
    # tree carries both versions. Re-check when notify-rust and the two plugins take zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant — unmaintained (merged into zbus 6), no flaw reported, Linux D-Bus layer under Tauri plugins" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names — unmaintained (merged into zbus 6), no flaw reported, Linux D-Bus layer under Tauri plugins" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive — unmaintained (merged into zbus 6), no flaw reported, Linux D-Bus layer under Tauri plugins" },
]

[licenses]
version = 2
# Copyleft in a shipped desktop binary is a licensing trap, not a style preference.
allow = [
    "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
    "ISC", "Zlib", "Unicode-3.0", "CC0-1.0", "MPL-2.0", "Unlicense", "CDLA-Permissive-2.0",
]
# BSL-1.0, OpenSSL and Unicode-DFS-2016 left in 1.6.5: no dependency uses them (cargo-deny's
# license-not-encountered). A new dependency under one of them now fails and gets looked at.
confidence-threshold = 0.9

# The app crate itself declares no license: the repository is private and ships no LICENSE.
# Before 1.6.5 that made `cargo deny check licenses` fail on `shvia-desktop` itself, which is
# why the CI only ran `check advisories`. `publish = false` + this makes the check about the
# DEPENDENCIES, which is the question it exists to answer.
[licenses.private]
ignore = true

[bans]
# 34 crates appear in two to five versions, all through Tauri and the windows-* family, and
# none is ours to unify. As warnings they would be 34 lines of CI noise nobody can act on,
# which trains people to skip the log. The check stays for what it is worth here: bans.
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "allow"          # Tauri plugins are sometimes pulled from git
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
