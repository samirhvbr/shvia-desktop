[package]
name = "shvia-desktop"
version = "1.6.23"
description = "ShvIA Desktop — cliente desktop multiplataforma do ShvIA (shell fino Tauri 2)"
authors = ["Samir Hanna Verza <samirhv@me.com>"]
edition = "2021"
# Never published to crates.io. It also tells cargo-deny this crate is private, so its
# missing license field is not a finding (see deny.toml [licenses.private]).
publish = false

# A versão acima é mantida em sincronia com version.md por scripts/sync-version.mjs.
# Demais chaves: https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# O sufixo `_lib` evita conflito de nome entre a lib e o binário no Windows.
# Ver https://github.com/rust-lang/cargo/issues/8519
name = "shvia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Binário release enxuto: sem símbolos, com LTO e panic=abort. Reduz o tamanho
# do .app/.msi/.deb e remove informações de debug de produção.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
# Abre links externos no navegador do SO. Mantido para a F2 (links externos da
# página remota + botão "abrir no navegador" da tela offline).
tauri-plugin-opener = "2"
# File picker nativo (F2 — "Vincular pasta do projeto"). Usamos só a API RUST
# (app.dialog().file().pick_folder) — nada de comando/IPC exposto à página.
tauri-plugin-dialog = "2"

# Notificações nativas do SO (alertas de preço — ADR-011). Usamos só a API RUST
# (app.notification().builder().show()) chamada pelo code_bridge; NENHUM comando/
# capability é exposto à página remota (mantém o ADR-001). Cross-platform.
tauri-plugin-notification = "2"
# Decodifica o artefato que a página manda para o `saveFile` da ponte (bytes em
# base64 — a página lê o /files/{id} com a sessão dela e repassa os bytes).
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Token de capacidade da ponte nativa (per-sessão, anti-iframe). Só v4 (CSPRNG).
uuid = { version = "1", features = ["v4"] }

# Pin de compatibilidade (não usamos `time` diretamente): o WebView
# (wry 0.55 → cookie 0.18.1) chama a API antiga de `Parsable::parse` (1 arg). O
# `time` novo mudou a assinatura (passou a exigir `defaults`), quebrando o
# `cookie`. Fixamos `time` numa versão compatível. Remover quando wry/cookie
# subirem para uma versão que aceite o `time` novo.
time = "=0.3.47"
tauri-plugin-autostart = "2"

# Persiste tamanho/posição das janelas entre reinícios (F2). É **DESKTOP-only** —
# no mobile a WebView é tela cheia e não existe o conceito de geometria de janela.
# O Cargo não conhece o cfg `desktop` do Tauri (é emitido pelo build script), então
# restringimos pelo alvo real: qualquer coisa que não seja Android/iOS.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"
# Uma instância só. Medido em 20/08/2026: DOIS `shvia-desktop` vivos (um de 19/08 14:08,
# outro de hoje 08:16) e um zumbi desde 06/08 — sem guarda, cada `shvia-desktop` sobe um
# app novo, com bandeja própria e contagem de janelas própria. É o que faz o `<= 1` do
# `CloseRequested` decidir certo sobre a instância ERRADA: cada uma acha que é a única.
# Aqui a segunda invocação FOCA a janela da primeira em vez de virar um segundo app.
tauri-plugin-single-instance = "2"
# Auto-update (item D1 — ADR-022). Dirigido SÓ pela API Rust (`src/updater.rs`):
# a capability não declara `updater:default`, senão a página remota poderia
# escolher o binário que roda na máquina (ADR-001). É **desktop-only** — no mobile
# a atualização é da loja, e o plugin não tem implementação lá.
tauri-plugin-updater = "2"

# Permissões de mídia (mic/câmera) no Linux: tratamos o signal `permission-request`
# do WebKitGTK via `with_webview`. A versão acompanha a do wry (não duplicar crate).
# `v2_8`: registramos um *script message handler* do WebKitGTK
# (`register_script_message_handler` + `connect_script_message_received`) para a
# ponte de leitura em voz (TTS) — ver ADR-009. A feature já vem ativa via wry
# (v2_38), mas declaramos aqui pra não depender disso.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_8"] }
# Extrai a string (JSON) do `JavascriptResult`/`JSCValue` recebido no message
# handler. Mesma versão que o `webkit2gtk` já resolve (tipos unificam).
javascriptcore-rs = "1.1"

# Ponte do Modo Code no macOS (WKScriptMessageHandler "shviaCode"). Versões
# CASADAS com o que o wry 0.55 resolve (Cargo.lock: objc2 0.6, web-kit 0.3) —
# senão os tipos do WKWebView não unificam com o ponteiro do with_webview.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-web-kit = "0.3"

# Ponte do Modo Code no Windows (WebView2 WebMessageReceived "window.chrome.webview").
# Mesma regra do macOS: versões CASADAS com o wry 0.55 (Cargo.lock: webview2-com
# 0.38, windows 0.61) p/ o ICoreWebView2 unificar com o with_webview. Só usamos
# `windows::core::PWSTR` (take_pwstr do webview2-com espera o PWSTR da crate
# `windows`), então nenhuma feature Win32 extra é necessária.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.38"
windows = "0.61"
