[package]
name = "shvia-desktop"
version = "0.5.8"
description = "ShvIA Desktop — cliente desktop multiplataforma do ShvIA (shell fino Tauri 2)"
authors = ["Samir Hanna Verza <samirhv@me.com>"]
edition = "2021"

# A versão acima é mantida em sincronia com version.md por scripts/sync-version.mjs.
# Demais chaves: https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# O sufixo `_lib` evita conflito de nome entre a lib e o binário no Windows.
# Ver https://github.com/rust-lang/cargo/issues/8519
name = "shvia_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Abre links externos no navegador do SO. Mantido para a F2 (links externos da
# página remota + botão "abrir no navegador" da tela offline).
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Pin de compatibilidade (não usamos `time` diretamente): o WebView
# (wry 0.55 → cookie 0.18.1) chama a API antiga de `Parsable::parse` (1 arg). O
# `time` novo mudou a assinatura (passou a exigir `defaults`), quebrando o
# `cookie`. Fixamos `time` numa versão compatível. Remover quando wry/cookie
# subirem para uma versão que aceite o `time` novo.
time = "=0.3.41"

# Persiste tamanho/posição das janelas entre reinícios (F2). É **DESKTOP-only** —
# no mobile a WebView é tela cheia e não existe o conceito de geometria de janela.
# O Cargo não conhece o cfg `desktop` do Tauri (é emitido pelo build script), então
# restringimos pelo alvo real: qualquer coisa que não seja Android/iOS.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

# Permissões de mídia (mic/câmera) no Linux: tratamos o signal `permission-request`
# do WebKitGTK via `with_webview`. A versão acompanha a do wry (não duplicar crate).
# `v2_8`: registramos um *script message handler* do WebKitGTK
# (`register_script_message_handler` + `connect_script_message_received`) para a
# ponte de leitura em voz (TTS) — ver ADR-009. A feature já vem ativa via wry
# (v2_38), mas declaramos aqui pra não depender disso.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0", features = ["v2_8"] }
# Extrai a string (JSON) do `JavascriptResult`/`JSCValue` recebido no message
# handler. Mesma versão que o `webkit2gtk` já resolve (tipos unificam).
javascriptcore-rs = "1.1"
