# CI do SHVIA-DESKTOP — achado G-24 da revisão de 01/09/2026.
#
# ## O que ele cobre, e por que não é o build
#
# Já existe `build-*.yml` para empacotar. Isto aqui é o que faltava: rodar as **provas** em
# todo push, sem esperar um release. São três, e cada uma nasceu de um achado desta revisão:
#
#  · `cargo test` — inclui `tests_cerca` (F-12): a cerca de pastas autorizadas da ponte
#    `code_bridge`, que antes deixava `gitStatus`/`readFile`/`spawn` alcançarem qualquer
#    caminho do disco;
#  · `prova:politica` — a política do motor "Claude Code (assinatura)" (F-13). Ela virou
#    módulo testável justamente porque a versão anterior passou no `node --check` e estava
#    quebrada: `path` nunca importado, `log()` inexistente. **Verificação de sintaxe não é
#    teste de fumaça**, e este job existe para essa lição não depender de memória;
#  · `prova:bump` — os portadores de versão alinhados (o SHVIA-CODE já ficou com o `master`
#    sem compilar por um bump pela metade).
#
# `clippy -D warnings` entra porque o achado F-20 registra dois warnings de doc parados: sem
# porta fechada, warning acumula até ninguém mais ler a saída.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provas:
    name: Provas (Rust + política do runner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # branch stable em 05/08/2026
        with:
          components: clippy
      # Dependências de sistema do Tauri no Linux. Sem elas o `cargo test` do
      # `src-tauri` nem compila, e o job falharia por ambiente e não por código.
      - name: Dependências do Tauri (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci --no-audit --no-fund
      - name: Política do claude-runner (F-13)
        run: npm run prova:politica
      # Does the runner LOAD? `node --check` only parses, and `politica.test.mjs` never
      # imports the runner (it runs on import). A missing named import in ESM fails when
      # the module is LINKED — and `--version` answers after the static import of the
      # policy and before the dynamic import of the SDK, so this is the cheapest probe
      # there is. Without it, 1.4.7 could drop `EDIT_TOOLS` and leave the reference for
      # two days.
      - name: The claude-runner links (1.4.7 regression)
        run: npm run prova:runner-version
      - name: Portadores de versão alinhados
        run: npm run prova:bump
      # The pre-commit hook checks the carriers in the INDEX, where 1.6.3 went wrong (1.6.33).
      - name: The pre-commit hook refuses a half-bumped commit
        run: npm run prova:guarda
      # A doc de "o que está implementado" acompanha a versão? (achado F-22 — este
      # arquivo já tinha sido saneado à mão DUAS vezes pelo mesmo motivo.)
      - name: Frescor da doc de estado (F-22)
        run: npm run prova:doc

      - name: O instalador copia todo modulo que o runner importa
        run: npm run prova:instalador
      # The updater-key check mark only prints when the proof happened (1.6.3). The
      # ruler existed but nothing called it, so a regression in build-local.sh would
      # go unseen until the one act this product cannot undo: a release with the wrong key.
      - name: The key-proof check mark needs the proof
        run: npm run prova:visto
      # A published version attaches its installers to its GitHub Release (f121), and a
      # failure there never breaks a publish that already reached the server.
      - name: The installers go to the Release, without breaking the publish
        run: npm run prova:anexa
      # A failed read of the published manifest aborts the publish instead of replacing the
      # server's manifest with one holding only this platform (1.6.20).
      - name: A failed manifest read never drops the other platforms
        run: npm run prova:manifesto
      # Every signature that ships is from the key the clients trust, and the key proof
      # deferred on a fresh clone runs after npm ci instead of never (1.6.21).
      - name: Every shipped signature is from the published key
        run: npm run prova:chaves
      # A key rotation's transition release is declared, signed with the OLD key, and happens once (1.6.40).
      - name: The updater key rotation has one declared transition release
        run: npm run prova:transicao
      # A Mac build without the Apple signature is never published, by any path (1.6.22).
      - name: An unsigned Mac build is never published
        run: npm run prova:apple
      # Notarization prefers the App Store Connect API key, and in that mode no password is
      # exported or passed to notarytool (1.6.39).
      - name: Notarization keeps the password off the command line
        run: npm run prova:notarizacao
      # Reusing the last bundle requires that nothing it carries changed (1.6.23).
      - name: The bundle reuse sees every bundled input
        run: npm run prova:reuso
      # With no anna staged, the stale one is removed and Tauri is told there is no
      # sidecar, instead of bundling an old engine or failing the build (1.6.24).
      - name: Packaging without anna ships no stale engine
        run: npm run prova:sem-anna
      # `--publish` ships only what is committed: a dirty or untracked build input refuses it (1.6.34).
      - name: A publish refuses a dirty build input
        run: npm run prova:arvore
      # Every tracked package.json and Cargo.toml has a Dependabot entry, and no entry is stale (1.6.35).
      - name: Dependabot watches every manifest
        run: npm run prova:dependabot
      # `src-tauri/binaries/` is gitignored on purpose: the `anna` sidecar depends on the
      # build machine (ADR-021), so it is staged by `scripts/stage-anna.mjs` and never
      # committed. But `externalBin` in `tauri.conf.json` makes the Tauri build script
      # REQUIRE the file, so on a clean checkout the crate does not compile at all —
      # `resource path binaries/anna-<triple> doesn't exist`.
      #
      # 🔴 That is why `cargo test` in this workflow had never once run. CI has been red
      # since it landed in 1.4.1, and the steps before this one were failing first, so the
      # output always blamed something else. The run is red either way, and nothing in it
      # says a later step is also broken.
      #
      # A stand-in is enough and cannot leak: nothing here executes the sidecar, and CI
      # does not package — the release build is local by decision (docs/build.md).
      - name: Sidecar stand-in so the Tauri build script can run
        run: |
          mkdir -p src-tauri/binaries
          triple="$(rustc -vV | awk '/^host:/{print $2}')"
          : > "src-tauri/binaries/anna-$triple"
          chmod +x "src-tauri/binaries/anna-$triple"
      # O motor Codex é instalação opcional, e por isso mesmo a régua que confere a
      # instalação precisa de uma instalação para conferir. O script não usa rede,
      # npm nem login: copia arquivos, escreve um wrapper e cai na cópia do schema
      # do repositório quando não há `codex` na máquina — que é o caso aqui.
      - name: Instala o codex-runner (a régua de CI confere a instalação)
        run: bash codex-runner/install.sh
      - name: cargo test (inclui a cerca da ponte — F-12)
        working-directory: src-tauri
        run: cargo test --locked
      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings
      # Tauri requires every externalBin to exist unless told there is none; this is the
      # override build-local.sh passes when no anna is staged (1.6.24). Without it,
      # --no-anna and "no anna on the build machine" could not build at all.
      - name: The app builds without the anna sidecar
        working-directory: src-tauri
        run: |
          mv binaries "$RUNNER_TEMP/binaries-stand-in"
          TAURI_CONFIG='{"bundle":{"externalBin":[]}}' cargo check --locked
          mv "$RUNNER_TEMP/binaries-stand-in" binaries
      # RustSec advisories (findings DEP-3 / F-31). The `ignore` list in
      # `src-tauri/deny.toml` carries a written reason per entry — the same doctrine as
      # `scripts/prova-auditoria.mjs` in SHVIA-WORKSPACE. It found a real one on day zero:
      # the `time = "=0.3.41"` pin had RUSTSEC-2026-0009, exactly where F-31 predicted.
      # Since 1.6.5 it runs every check (advisories, bans, licenses, sources): licenses used
      # to fail on the app crate itself, which is private (`publish = false`).
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check
