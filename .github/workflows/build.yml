name: build

# Build dos instaladores do ShvIA Desktop nos 3 SOs (macOS, Linux, Windows).
# Modelado no CI do SHVTERM, porém enxuto: o ShvIA é shell fino (sem sidecar
# Python, sem WireGuard). Assinatura/notarização entram na F4 (quando os certs
# forem procurados — Apple Developer ID, Authenticode EV Windows, chave do
# updater Tauri); por ora os bundles saem **sem assinatura**.
#
# NOTA (hardening F4): as actions abaixo usam tags (@vN). O padrão do SHVTERM é
# pinar por SHA (supply-chain) — fazer o mesmo quando estabilizar.

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Menor privilégio: por padrão o GITHUB_TOKEN só LÊ; o job de release eleva
# para `contents: write` localmente.
permissions:
  contents: read

jobs:
  # Sanidade da casca web em todo push/PR (rápido).
  casca:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Frontend — build (sync-version + tsc + vite)
        run: npm run build

  # Empacotamento multiplataforma — só em tag v* ou disparo manual.
  app:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci

      - name: Sincroniza versão (version.md → manifests)
        run: npm run version:sync

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux — deps do WebKitGTK/Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev \
            build-essential curl wget file libxdo-dev libssl-dev patchelf

      - name: Build do app (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # F4: chave do updater Tauri (latest.json) entra aqui quando existir:
          # TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD.
          # macOS Developer ID + notarização e Windows Authenticode EV idem.

      - name: Publica instaladores (artefatos)
        uses: actions/upload-artifact@v4
        with:
          name: shvia-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.app.tar.gz
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*-setup.exe

  # GitHub Release com SHA-256 — apenas em tag v*.
  release:
    needs: app
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download dos artefatos
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Gera SHA256SUMS.txt
        run: |
          cd dist
          find . -type f \( \
            -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \
            -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \
            -o -name '*.app.tar.gz' \
          \) | sort | while read -r f; do
            echo "$(sha256sum "$f" | awk '{print $1}')  $(basename "$f")"
          done > ../SHA256SUMS.txt
          echo '=== SHA256SUMS.txt ===' && cat ../SHA256SUMS.txt

      - name: Publica GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ShvIA Desktop ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            dist/**/*.deb
            dist/**/*.AppImage
            dist/**/*.rpm
            dist/**/*.dmg
            dist/**/*.msi
            dist/**/*-setup.exe
            dist/**/*.app.tar.gz
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
