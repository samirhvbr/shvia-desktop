name: Windows installer validation (1.44.1)

on:
  push:
    branches: [test/windows-install-1.44.1]

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Install and open (${{ matrix.bundle }})
    strategy:
      fail-fast: false
      matrix:
        bundle: [nsis, msi]
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/windows-install-smoke
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shvia-desktop-1.44.1-windows-x64-unsigned-test-installers
          path: test-packages
          run-id: 45470555167
          github-token: ${{ github.token }}
      - name: Install Desktop and verify the login page in its WebView2
        shell: powershell
        env:
          INSTALLER_KIND: ${{ matrix.bundle }}
        run: |
          ./.github/windows-install-smoke/install-and-open.ps1 -InstallerKind $env:INSTALLER_KIND
      - name: Save launch evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: launch-evidence-${{ matrix.bundle }}
          path: smoke-evidence
          if-no-files-found: warn
          retention-days: 7
