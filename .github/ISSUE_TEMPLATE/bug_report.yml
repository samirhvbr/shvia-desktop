name: Bug Report
description: Report a bug in SHVIA-DESKTOP.
title: "[bug]: "
body:
  - type: textarea
    id: doctor
    attributes:
      label: Version (`shvia-desktop --doctor` output)
      description: |
        Run `shvia-desktop --doctor` in a terminal and paste the full output here.
        If the app won't start, the AppImage filename (e.g. `shvia-desktop-0.2.0-amd64.AppImage`)
        or the version from **Help → About** is acceptable.
      render: shell
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the bug. What did you see?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the bug.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen? "Expected X, got Y" phrasing is helpful.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / errors
      description: |
        Relevant log output or stack traces. Common locations:
        - App logs: `~/.config/Claude/logs/`
        - Launcher log: `~/.cache/shvia-desktop/launcher.log`
      render: shell
    validations:
      required: false
  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: Additional context, screenshots, or links.
    validations:
      required: false
