<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0F17" />
    <!-- Mesma marca do splash: o ícone da aba/janela é PRÉ-LOGIN, então segue a
         regra de marca da migração (a Blue3 só depois do login). O favicon.png antigo
         era a seta da Blue3; SVG porque o WebView renderiza vetor. -->
    <link rel="icon" type="image/svg+xml" href="/brand-mark.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
    <title>ShvIA</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <!-- Splash de lançamento (backport do SHVIA-MOBILE 0.2.2): marca "respirando"
         + ondas de sonar enquanto conecta; estado offline com retry (src/main.ts
         troca o data-state). Paleta = tokens do ShvIA web, pra transição
         casca→app ser invisível. -->
    <main id="bootstrap" class="bootstrap" role="status" aria-live="polite" data-state="connecting">
      <div class="mark-wrap">
        <span class="ripple" aria-hidden="true"></span>
        <span class="ripple ripple--late" aria-hidden="true"></span>
        <img class="brand-mark" src="/brand-mark.svg" alt="" width="176" height="176" />
      </div>
      <h1>ShvIA</h1>
      <p id="status">Conectando ao ShvIA…</p>
      <div class="actions only-offline">
        <button id="retry" type="button">Tentar agora</button>
        <button id="force-open" type="button" class="ghost">Abrir mesmo assim</button>
      </div>

      <!-- Formulário de servidor (item D4; ADR-019). Fica no MESMO <main> do
           splash e é alternado pelo data-state, para a casca continuar sendo um
           arquivo só sem roteador. -->
      <form id="server-form" class="server-form only-server" novalidate>
        <label for="server-url">Endereço do servidor ShvIA</label>
        <input
          id="server-url"
          name="server-url"
          type="text"
          inputmode="url"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="ai.shvia.org"
        />
        <p id="server-error" class="server-error" role="alert" aria-live="assertive"></p>
        <!-- O aviso é obrigatório, não decorativo: o host configurado passa a
             receber as pontes nativas (Modo Code executa processo local, lê
             arquivo). Quem digita precisa saber o que está concedendo. -->
        <p class="server-warn">
          O servidor informado recebe <strong>acesso nativo</strong> do aplicativo
          (Modo Code, notificações, badge). Use apenas um ShvIA em que você confia.
        </p>
        <div class="actions">
          <button type="submit">Salvar e conectar</button>
          <button id="server-reset" type="button" class="ghost" hidden>Voltar ao padrão</button>
          <button id="server-cancel" type="button" class="ghost">Cancelar</button>
        </div>
      </form>

      <!-- Sempre visível fora do formulário: saber PARA ONDE o app vai entrar
           antes de entrar. É também o único caminho de configuração no 1º run,
           porque quem usa o servidor padrão nunca vê a tela offline. -->
      <p class="server-line hide-on-server">
        <span class="server-line__label">Servidor</span>
        <span id="server-label" class="server-line__value"></span>
        <button id="server-change" type="button">trocar</button>
      </p>
      <noscript>Este aplicativo precisa de JavaScript para carregar o ShvIA.</noscript>
    </main>
  </body>
</html>
